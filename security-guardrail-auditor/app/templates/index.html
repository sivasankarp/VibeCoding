<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="mx-auto flex max-w-3xl flex-col gap-6 px-6 py-16">
      <p class="text-xs uppercase tracking-[0.3em] text-emerald-400/80">Phase 1</p>
      <h1 class="text-3xl font-semibold tracking-tight">{{ app_name }}</h1>
      <p class="text-slate-400">
        API and database layer are online. Dashboard charts, scan APIs, and the Terraform rule
        engine ship in the next phases.
      </p>
      <div class="flex flex-wrap gap-3">
        <a
          class="rounded-lg bg-emerald-500 px-4 py-2 text-sm font-medium text-slate-950 hover:bg-emerald-400"
          href="/docs"
          >OpenAPI docs</a
        >
        <a
          class="rounded-lg border border-slate-700 px-4 py-2 text-sm font-medium text-slate-200 hover:border-emerald-500/60"
          href="/health"
          >Health JSON</a
        >
      </div>
    </div>
  </body>
</html>
